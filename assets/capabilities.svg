<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Engineering capabilities</title>
  <desc id="desc">Cards describing backend systems, fintech systems and applied AI work.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#111c32"/></linearGradient>
    <linearGradient id="blue"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="teal"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="violet"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="#070d19"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(24 24)"><rect width="368" height="252" rx="20" fill="url(#card)" stroke="#1e3a5f"/><rect width="368" height="6" rx="3" fill="url(#blue)"/><circle cx="52" cy="58" r="18" fill="#0c4a6e" stroke="#38bdf8"/><path d="M43 58h18M52 49v18" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round"/><text x="84" y="67" fill="#f8fafc" font-size="25" font-weight="700">Backend systems</text><text x="32" y="116" fill="#cbd5e1" font-size="17">Secure APIs and service boundaries</text><text x="32" y="151" fill="#cbd5e1" font-size="17">Relational data and background work</text><text x="32" y="186" fill="#cbd5e1" font-size="17">Testing, observability and recovery</text><text x="32" y="225" fill="#7dd3fc" font-size="15" font-weight="600">CORRECTNESS BEFORE COMPLEXITY</text></g>
    <g transform="translate(416 24)"><rect width="368" height="252" rx="20" fill="url(#card)" stroke="#134e4a"/><rect width="368" height="6" rx="3" fill="url(#teal)"/><circle cx="52" cy="58" r="18" fill="#134e4a" stroke="#2dd4bf"/><path d="M43 54h18M43 62h18" stroke="#ccfbf1" stroke-width="3" stroke-linecap="round"/><text x="84" y="67" fill="#f8fafc" font-size="25" font-weight="700">Fintech systems</text><text x="32" y="116" fill="#cbd5e1" font-size="17">Payments, ledgers and reconciliation</text><text x="32" y="151" fill="#cbd5e1" font-size="17">Idempotency and immutable audit trails</text><text x="32" y="186" fill="#cbd5e1" font-size="17">Threat models and failure handling</text><text x="32" y="225" fill="#5eead4" font-size="15" font-weight="600">MONEY NEEDS PROVABLE STATE</text></g>
    <g transform="translate(808 24)"><rect width="368" height="252" rx="20" fill="url(#card)" stroke="#4c1d95"/><rect width="368" height="6" rx="3" fill="url(#violet)"/><circle cx="52" cy="58" r="18" fill="#3b0764" stroke="#a78bfa"/><circle cx="47" cy="56" r="3" fill="#ede9fe"/><circle cx="58" cy="51" r="3" fill="#ede9fe"/><circle cx="57" cy="64" r="3" fill="#ede9fe"/><path d="M49 55l7-3M49 58l6 5" stroke="#ede9fe" stroke-width="2"/><text x="84" y="67" fill="#f8fafc" font-size="25" font-weight="700">Applied AI</text><text x="32" y="116" fill="#cbd5e1" font-size="17">Evaluated ML and LLM services</text><text x="32" y="151" fill="#cbd5e1" font-size="17">RAG, retrieval and document workflows</text><text x="32" y="186" fill="#cbd5e1" font-size="17">Monitoring, rollback and human review</text><text x="32" y="225" fill="#c4b5fd" font-size="15" font-weight="600">EVIDENCE OVER DEMO EFFECT</text></g>
  </g>
