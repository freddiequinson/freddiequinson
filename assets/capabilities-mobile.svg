<svg xmlns="http://www.w3.org/2000/svg" width="390" height="720" viewBox="0 0 390 720" role="img" aria-labelledby="title desc">
  <title id="title">Engineering capabilities</title>
  <desc id="desc">Stacked cards for backend systems, fintech systems and applied AI work.</desc>
