<svg xmlns="http://www.w3.org/2000/svg" width="390" height="280" viewBox="0 0 390 280" role="img" aria-labelledby="title desc">
  <title id="title">Fredrick Agyare</title>
  <desc id="desc">Animated mobile profile banner for a backend engineer focused on applied AI and fintech systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10162a"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#818cf8;#2dd4bf;#38bdf8" dur="9s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="388" height="278" rx="22" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <g fill="none" stroke="url(#line)" opacity="0.6"><path d="M268 44h44l27 27h34"/><path d="M292 104h35l25-22h24"/></g>
  <g fill="#38bdf8"><circle cx="268" cy="44" r="4"><animate attributeName="r" values="3;6;3" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="339" cy="71" r="4"/><circle cx="292" cy="104" r="4"/></g>
  <text x="28" y="56" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2">SYSTEMS THAT MUST HOLD UP</text>
  <text x="26" y="124" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="750">Fredrick Agyare</text>
  <rect x="28" y="144" width="270" height="4" rx="2" fill="url(#line)"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">
    <text x="28" y="194" fill="#38bdf8">Backend systems<animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.29;0.34;0.63;0.67;0.96;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="28" y="194" fill="#818cf8" opacity="0">Fintech engineering<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.34;0.63;0.67;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="28" y="194" fill="#2dd4bf" opacity="0">Applied AI<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.63;0.67;0.96;1" dur="9s" repeatCount="indefinite"/></text>
  </g>
  <text x="28" y="238" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">Auditability / Security / Reliability</text>
</svg>
