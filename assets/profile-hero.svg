<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Fredrick Agyare</title>
  <desc id="desc">Animated profile banner for a backend engineer focused on applied AI and fintech systems.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.5" stop-color="#0b1d35"/>
      <stop offset="1" stop-color="#10162a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#818cf8;#2dd4bf;#38bdf8" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#8b5cf6"><animate attributeName="stop-color" values="#8b5cf6;#2dd4bf;#38bdf8;#8b5cf6" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.32"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <circle cx="1040" cy="42" r="250" fill="url(#glow)"><animateTransform attributeName="transform" type="translate" values="0 0;-85 50;0 0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="350" r="210" fill="url(#glow)" opacity="0.55"><animateTransform attributeName="transform" type="translate" values="0 0;70 -45;0 0" dur="13s" repeatCount="indefinite"/></circle>
    <g fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5">
      <path d="M790 95 H900 L955 150 H1120"/><path d="M835 260 H930 L995 205 H1140"/><path d="M745 178 H875"/>
    </g>
    <g fill="#38bdf8">
      <circle cx="790" cy="95" r="6"><animate attributeName="r" values="4;8;4" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="955" cy="150" r="6"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="835" cy="260" r="6"><animate attributeName="r" values="6;3;6" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="995" cy="205" r="6"><animate attributeName="opacity" values="1;0.3;1" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="875" cy="178" r="9" filter="url(#softGlow)"/><circle cx="875" cy="178" r="5"/>
    </g>
    <text x="74" y="92" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="4">ENGINEERING FOR SYSTEMS THAT MUST HOLD UP</text>
    <text x="70" y="176" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="750">Fredrick Agyare</text>
    <rect x="73" y="201" width="510" height="4" rx="2" fill="url(#accent)"/>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">
      <text x="74" y="256" fill="#38bdf8">Backend systems<animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.29;0.34;0.63;0.67;0.96;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="74" y="256" fill="#818cf8" opacity="0">Fintech engineering<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.34;0.63;0.67;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="74" y="256" fill="#2dd4bf" opacity="0">Applied AI<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.63;0.67;0.96;1" dur="9s" repeatCount="indefinite"/></text>
      <rect x="325" y="232" width="3" height="30" fill="#e2e8f0"><animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></rect>
    </g>
    <text x="74" y="311" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="18">Auditability  /  Security  /  Reliability  /  Independent evidence</text>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#334155" stroke-width="2"/>
</svg>
